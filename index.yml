# Preset index — maps preset paths to their top-level key and description.

presets:
  # Section-scoped (one top-level key each)
  - path: "preset/docker-targets.yml"
    key: targets
    description: "Docker registries (Hub+Harbor), dev/stable/pre channels, README sync, release"
  - path: "preset/docker-badges.yml"
    key: badges
    description: "Badge definitions for Docker projects (build, license, release, pulls, dev/stable)"
  - path: "preset/binary-targets.yml"
    key: targets
    description: "Binary archive channels (dev + stable), checksums, release"
  - path: "preset/security.yml"
    key: security
    description: "Security scanning: sbom, full release detail"
  - path: "preset/dependency.yml"
    key: dependency
    description: "Dependency updates: go_modules + dockerfile_env, auto-commit"
  - path: "preset/docs.yml"
    key: docs
    description: "Docs generation: badges, narrator, docker-readme, auto-commit"
  - path: "preset/commit.yml"
    key: commit
    description: "Commit policy: conventional commits, forge backend"
  - path: "preset/release.yml"
    key: release
    description: "Release policy: security summary, registry links"
  - path: "preset/lint-full.yml"
    key: lint
    description: "Lint: full level, all standard modules"
