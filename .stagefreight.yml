version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

lifecycle:
  mode: governance

# MaintenancePolicy's own forge identity (it is itself a StageFreight repo).
forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB

repos:
  primary:
    forge: gitlab
    project: "PrPlanIT/MaintenancePolicy"
    roles: [primary]
    branches:
      default: main
    worktree: "."

# ──────────────────────────────────────────────────────────────────────
# PROOF: one bucket, one non-crucial repo. Prove reconcile writes the
# expected managed config before expanding the bucket / touching crucial repos.
# ──────────────────────────────────────────────────────────────────────
governance:
  clusters:
    - id: rebaseable-fork-docker
      targets:
        # HomeLabHD-scoped token (has write to the group + its protected branches).
        # reconcile auths with GITLAB_HOMELABHD_TOKEN instead of the default GITLAB_*.
        credentials: GITLAB_HOMELABHD
        repos:
          - "HomeLabHD/prometheus-eaton-ups-exporter"
      stagefreight:
        version: 1
        ci:
          image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
        # Reconciled fork policy: default branch = main, no_lineage = explicit.
        git:
          preset: "preset/git.yml"
        builds:
          preset: "preset/build-docker.yml" # generic build id 'image' (no per-repo name)
        forges:
          preset: "preset/forges.yml"
        repos:
          preset: "preset/repos.yml"
        registries:
          preset: "preset/registries.yml"
        publish:
          preset: "preset/publish-docker.yml"
        build_cache:
          preset: "preset/build_cache.yml"
        dependency:
          preset: "preset/dependency.yml"
        commit:
          preset: "preset/commit.yml"
        lint:
          preset: "preset/lint-generic.yml"
        manifest:
          preset: "preset/manifest.yml"
        release:
          preset: "preset/release.yml"
        security:
          preset: "preset/security.yml"
        toolchains:
          preset: "preset/toolchains.yml"
        stencils:
          preset: "preset/stencils-docker.yml"
        scribe:
          preset: "preset/scribe.yml"
