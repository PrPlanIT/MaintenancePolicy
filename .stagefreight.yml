        scribe: { preset: "preset/scribe-go.yml" }

      repos:
        DisplayWizard:
          at: PrPlanIT/DisplayWizard
          # Windows-only, and the desktop artifact is an Electron pack rather than a Go
          # binary -- it depends on the Go build and is produced by a node builder in a
          # wine image. The archive names are the product name, not the slug, so the
          # publish section is restated with its own naming.
          config:
            builds:
              dwiz:
                kind: binary
                builder: go
                from: ./cmd/dwiz
                output: dwiz
                env: { CGO_ENABLED: "0" }
                args: ["-ldflags", "-s -w -X github.com/PrPlanIT/DisplayWizard/src/version.Version={version} -X github.com/PrPlanIT/DisplayWizard/src/version.Commit={sha} -X github.com/PrPlanIT/DisplayWizard/src/version.BuildDate={date}"]
                platforms: [windows/amd64]
              bin:
                kind: binary
                builder: node
                from: .
                depends_on: dwiz
                platforms: [windows/amd64]
                image: electronuserland/builder:wine
                output: ui/desktop/release/*.exe
                command: "corepack enable && pnpm install --no-frozen-lockfile && pnpm -r build && mkdir -p ui/desktop/bin && cp .stagefreight/dist/windows-amd64/dwiz.exe ui/desktop/bin/dwiz.exe && pnpm -C ui/desktop run pack"
            publish:
              preset: "preset/publish-binary.yml"
              binaries-dev:
                kind: binary-archive
                build: bin
                name: "VDisplay-Wizard-latest-dev-{os}-{arch}"
                format: auto
                checksums: true
                when: { branches: [main], events: [push, manual] }
              binaries:
                kind: binary-archive
                build: bin
                name: "VDisplay-Wizard-{version}-{os}-{arch}"
                format: auto
                checksums: true
                include: ["README.md", "LICENSE"]
                when: { git_tags: [stable], events: [tag] }
          title: "Display Wizard"
          description:
            - "Windows desktop app for managing virtual displays."
            - "Desktop utility for creating and arranging virtual displays on Windows, packaged as an Electron app over a Go core."
          topics: [windows, desktop, displays, electron]
          license: MIT
          category: applications

