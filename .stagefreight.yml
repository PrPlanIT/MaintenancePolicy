    # Dungeon: a gitops repo, not a build. No builds, no publish, no registries -- the
    # repo IS the cluster state. Its badges describe the estate (flux, k8s, ansible,
    # compose, app inventory) rather than an artifact, so they stay repo-declared; the
    # shared rows below come from the same presets everything else uses, in the same
    # order, so only the genuinely unique rows differ.
    sofmeright-gitops:
      credentials: GITLAB_SOFMERIGHT
      config:
        version: 1
        ci:
          forge: [gitlab]
          image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
        lifecycle:
          mode: gitops
        orgs:
          SoFMeRight:
            maintainer: "SoFMeRight <sofmeright@gmail.com>"
            aliases: { handle: sofmeright, github: SoFMeRight, docker: sofmeright, ghcr: sofmeright }
