version: 1

sources:
  primary:
    url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
    default_branch: "main"

lifecycle:
  mode: governance

defaults:
  # ── Shared asset declarations ──────────────────────────────────
  standard-skeleton: &standard-skeleton
    id: ci-skeleton
    source:
      repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
      ref: "main"
      path: "integrations/gitlab/standard.gitlab-ci.yml"
    target: ".gitlab-ci.yml"

  lightweight-skeleton: &lightweight-skeleton
    id: ci-skeleton
    source:
      repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
      ref: "main"
      path: "integrations/gitlab/lightweight.gitlab-ci.yml"
    target: ".gitlab-ci.yml"

  claude-settings: &claude-settings
    id: claude-settings
    source:
      repo_url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
      ref: "main"
      path: "claude-code/project-settings.json"
    target: ".claude/settings.json"

  # ── Shared preset blocks ───────────────────────────────────────
  full-docker-presets: &full-docker-presets
    targets:
      preset: "preset/docker-targets.yml"
    badges:
      preset: "preset/docker-badges.yml"
    security:
      preset: "preset/security.yml"
    dependency:
      preset: "preset/dependency.yml"
    docs:
      preset: "preset/docs.yml"
    commit:
      preset: "preset/commit.yml"
    release:
      preset: "preset/release.yml"
    lint:
      preset: "preset/lint-full.yml"

governance:
  clusters:
    # ── PrPlanIT: Binary apps ────────────────────────────────────
    - id: prplanit-displaywizard
      targets:
        repos:
          - "PrPlanIT/DisplayWizard"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-prplanit.yml"
        assets:
          - *standard-skeleton
          - *claude-settings
        targets:
          preset: "preset/binary-targets.yml"
        security:
          preset: "preset/security.yml"
        lint:
          preset: "preset/lint-full.yml"

    # ── PrPlanIT: Binaries + Docker (OCI) ────────────────────────
    - id: prplanit-binary-docker
      targets:
        repos:
          - "PrPlanIT/StageFreight"
          - "PrPlanIT/HASteward"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-prplanit.yml"
        assets:
          - *standard-skeleton
          - *claude-settings
        <<: *full-docker-presets

    # ── PrPlanIT: Docker (OCI) ───────────────────────────────────
    - id: prplanit-docker
      targets:
        repos:
          - "PrPlanIT/fairer-pages"
          - "PrPlanIT/oh-CI"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-prplanit.yml"
        assets:
          - *standard-skeleton
          - *claude-settings
        <<: *full-docker-presets

    # ── HomeLabHD: Docker services ───────────────────────────────
    - id: hlhd-docker
      targets:
        repos:
          - "HomeLabHD/apt-cacher-ng"
          - "HomeLabHD/prometheus-eaton-ups-exporter"
          - "HomeLabHD/sm-lickitung-gen"
          - "HomeLabHD/ansible"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-hlhd.yml"
        assets:
          - *standard-skeleton
          - *claude-settings
        <<: *full-docker-presets

    # ── SoFMeRight: GitOps repos ────────────────────────────────
    - id: sofmeright-dungeon
      targets:
        repos:
          - "SoFMeRight/dungeon"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-sofmeright.yml"
        assets:
          - *lightweight-skeleton
          - *claude-settings
        docs:
          preset: "preset/docs.yml"
        commit:
          preset: "preset/commit.yml"
        lint:
          preset: "preset/lint-full.yml"
