version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

# The control repo runs in governance mode: its own pipeline reconciles the profiles
# below into their satellites (rather than building an image). Governance activation is
# presence-gated on governance.profiles; the mode selects THIS repo's phase behavior.
lifecycle:
  mode: governance

# Named branch matchers referenced by publish/scribe when: gates.
git:
  branches:
    main: "^main$"

# ── surfaces: MaintenancePolicy's forges. default_path lets {path.<id>} derive. ──
forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB
    default_path: "{org}/{repo}"
  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB
    default_path: "{org}/{repo}"

# ── orgs = identity only (maintainer + aliases). No forge, no credentials. ──
orgs:
  PrPlanIT:
    maintainer: "PrPlanIT <precisionplanit@gmail.com>"
    aliases: { handle: prplanit }
  HomeLabHD:
    maintainer: "HomeLabHD <homelabhelp@gmail.com>"
    aliases: { handle: hlhd }
  SoFMeRight:
    maintainer: "SoFMeRight <sofmeright@gmail.com>"
    aliases: { handle: sofmeright }

# ── MaintenancePolicy's OWN first-class identity (it is a repo too). ──
metadata:
  org: PrPlanIT
  title: "Maintenance Policy"
  description:
    - "Central maintenance policy + catalog for PrPlanIT / HomeLabHD repos."
    - "The StageFreight governance control repo: one place that owns org identity, per-repo branding, and shared lifecycle policy, reconciled into satellite repos."
  topics: [governance, stagefreight, catalog]
  license: MIT

repos:
  primary:
    forge: gitlab
    project: "PrPlanIT/MaintenancePolicy"
    roles: [primary]
    branches:
      default: main
    worktree: "."
  # GitHub mirror: the public face of the control repo. Carries the same README +
  # badges (mirror role → syncMirrors pushes content) and receives the identity push
  # (description/topics) from the project-meta target below.
  github:
    forge: github
    project: "PrPlanIT/MaintenancePolicy"
    roles: [mirror, publish-origin]   # publish-origin: the github-* badge producers (last-commit, contributors) resolve here

# ── project identity push: sync the metadata: block to both forges' About panels ──
# The control repo is a repo too; publish syncs its own title/description/topics to
# GitLab and GitHub. Identity comes from the metadata: block above (no fields inline)
# — the target says only WHERE to push. Runs in publish (which owns forge mutation).
publish:
  project-meta:
    kind: metadata
    repos: [primary, github]
    when: { branches: [main], events: [push] }

# ──────────────────────────────────────────────────────────────────────
# Governance: presence-gated (no lifecycle.mode). One profile, one repo (proof).
# A BRANDED catalog entry → governance distributes CI policy AND identity.
# ──────────────────────────────────────────────────────────────────────
governance:
  profiles:
    rebaseable-fork-docker:
      # HomeLabHD-scoped token: write to the group + its protected branches.
      credentials: GITLAB_HOMELABHD

      # WHAT — shared config distributed to every repo in this profile. Carries the
      # orgs block so each governed repo resolves {org.*}/{path.*} for its own identity.
      config:
        version: 1
        ci:
          image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
        orgs:
          HomeLabHD:
            maintainer: "HomeLabHD <homelabhelp@gmail.com>"
            aliases: { handle: hlhd }
        git: { preset: "preset/git.yml" }
        builds: { preset: "preset/build-docker.yml" }
        forges: { preset: "preset/forges.yml" }
        repos: { preset: "preset/repos.yml" }
        registries: { preset: "preset/registries.yml" }
        publish: { preset: "preset/publish-docker.yml" }
        build_cache: { preset: "preset/build_cache.yml" }
        dependency: { preset: "preset/dependency.yml" }
        commit: { preset: "preset/commit.yml" }
        lint: { preset: "preset/lint-generic.yml" }
        manifest: { preset: "preset/manifest.yml" }
        release: { preset: "preset/release.yml" }
        security: { preset: "preset/security.yml" }
        toolchains: { preset: "preset/toolchains.yml" }
        stencils: { preset: "preset/stencils-docker.yml" }
        scribe: { preset: "preset/scribe.yml" }

      # WHO — the catalog. A BRANDED entry: governance distributes this repo's identity
      # (title/description/topics/license) as its metadata: block, on top of the CI policy.
      # org + slug derive from the location; the description feeds registry overviews +
      # the forge About, the license the license badge, {path.*} its coordinates.
      repos:
        prometheus-eaton-ups-exporter:
          at: HomeLabHD/prometheus-eaton-ups-exporter
          title: "Eaton UPS Exporter"
          description:
            - "Prometheus exporter for Eaton UPS devices over SNMP/HTTP."
            - "Rootless container exporting Eaton UPS load, runtime, battery, and I/O metrics to Prometheus."
          topics: [prometheus, exporter, ups, eaton, monitoring, snmp]
          license: MIT
          category: monitoring

# ──────────────────────────────────────────────────────────────────────
# The control repo's OWN badge library. Coordinates come from facts, not literals:
# {metadata.license} from the metadata: block, {path.<forge>} from each forge's
# default_path — the same derivation the catalog gives satellites, dogfooded here.
# ──────────────────────────────────────────────────────────────────────
stencils:
  # ── row 1 · identity + freshness (rendered SVGs) ──
  license:
    label: license
    message: "{metadata.license}"
    color: "#310937"
    font: monofur
    link: LICENSE
  updated:
    label: updated
    message: "{commit.date}"
    color: "#236144"
    font: dejavu-sans
    font_size: 11
  stagefreight:
    render: shield
    label: governed by
    message: StageFreight
    color: "#310937"
    logo: readthedocs
    logo_color: white
    link: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"

  # ── row 2 · source + activity (shields + github producers) ──
  gitlab:
    render: shield
    label: GitLab
    message: source
    color: "#FC6D26"
    logo: gitlab
    link: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
  github:
    render: shield
    label: GitHub
    message: mirror
    color: "#181717"
    logo: github
    link: "https://github.com/PrPlanIT/MaintenancePolicy"
  last-commit:  { type: github-last-commit }
  contributors: { type: github-contributors }

# The control repo narrates ITSELF: publish (which owns forge mutation, all modes)
# runs scribe, renders these badges into README.md, and commits + mirrors them.
scribe:
  files:
    readme.badges:
      file: README.md
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      inline: true
      items: [license, updated, stagefreight]
    readme.project:
      file: README.md
      between: ["<!-- sf:project:start -->", "<!-- sf:project:end -->"]
      inline: true
      items: [gitlab, github, last-commit, contributors]
  commit:
    type: docs
    message: "refresh generated badges"
    add:
      - README.md
      - ".stagefreight/scribe"
    push: true
    skip_ci: true
