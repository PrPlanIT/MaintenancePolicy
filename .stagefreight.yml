version: 1

lifecycle:
  mode: governance

governance:
  clusters:
    - id: docker-services
      targets:
        repos:
          - "PrPlanIT/fairer-pages"
          - "PrPlanIT/oh-CI"
          - "PrPlanIT/HomeLabHD/apt-cacher-ng"
          - "PrPlanIT/HomeLabHD/prometheus-eaton-ups-exporter"
          - "PrPlanIT/HomeLabHD/sm-lickitung-gen"
      stagefreight:
        version: 1
        assets:
          - id: ci-skeleton
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
              ref: "main"
              path: "integrations/gitlab/standard.gitlab-ci.yml"
            target: ".gitlab-ci.yml"
          - id: claude-settings
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
              ref: "main"
              path: "claude-code/project-settings.json"
            target: ".claude/settings.json"
        targets:
          preset: "preset/docker-targets.yml"
        badges:
          preset: "preset/docker-badges.yml"
        security:
          preset: "preset/security.yml"
        dependency:
          preset: "preset/dependency.yml"
        docs:
          preset: "preset/docs.yml"
        commit:
          preset: "preset/commit.yml"
        release:
          preset: "preset/release.yml"
        lint:
          preset: "preset/lint-full.yml"

    - id: docker-binary
      targets:
        repos:
          - "PrPlanIT/StageFreight"
          - "PrPlanIT/HASteward"
      stagefreight:
        version: 1
        assets:
          - id: ci-skeleton
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
              ref: "main"
              path: "integrations/gitlab/standard.gitlab-ci.yml"
            target: ".gitlab-ci.yml"
          - id: claude-settings
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
              ref: "main"
              path: "claude-code/project-settings.json"
            target: ".claude/settings.json"
        targets:
          preset: "preset/docker-targets.yml"
        badges:
          preset: "preset/docker-badges.yml"
        security:
          preset: "preset/security.yml"
        dependency:
          preset: "preset/dependency.yml"
        docs:
          preset: "preset/docs.yml"
        commit:
          preset: "preset/commit.yml"
        release:
          preset: "preset/release.yml"
        lint:
          preset: "preset/lint-full.yml"

    - id: docker-component
      targets:
        repos:
          - "PrPlanIT/HomeLabHD/ansible"
      stagefreight:
        version: 1
        assets:
          - id: ci-skeleton
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
              ref: "main"
              path: "integrations/gitlab/standard.gitlab-ci.yml"
            target: ".gitlab-ci.yml"
          - id: claude-settings
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
              ref: "main"
              path: "claude-code/project-settings.json"
            target: ".claude/settings.json"
        targets:
          preset: "preset/docker-targets.yml"
        badges:
          preset: "preset/docker-badges.yml"
        security:
          preset: "preset/security.yml"
        dependency:
          preset: "preset/dependency.yml"
        docs:
          preset: "preset/docs.yml"
        commit:
          preset: "preset/commit.yml"
        release:
          preset: "preset/release.yml"
        lint:
          preset: "preset/lint-full.yml"

    - id: gitops-repos
      targets:
        repos:
          - "SoFMeRight/dungeon"
      stagefreight:
        version: 1
        assets:
          - id: ci-skeleton
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
              ref: "main"
              path: "integrations/gitlab/lightweight.gitlab-ci.yml"
            target: ".gitlab-ci.yml"
          - id: claude-settings
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
              ref: "main"
              path: "claude-code/project-settings.json"
            target: ".claude/settings.json"
        docs:
          preset: "preset/docs.yml"
        commit:
          preset: "preset/commit.yml"
        lint:
          preset: "preset/lint-full.yml"

    - id: binary-apps
      targets:
        repos:
          - "PrPlanIT/DisplayWizard"
      stagefreight:
        version: 1
        assets:
          - id: ci-skeleton
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
              ref: "main"
              path: "integrations/gitlab/standard.gitlab-ci.yml"
            target: ".gitlab-ci.yml"
          - id: claude-settings
            source:
              repo_url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
              ref: "main"
              path: "claude-code/project-settings.json"
            target: ".claude/settings.json"
        targets:
          preset: "preset/binary-targets.yml"
        security:
          preset: "preset/security.yml"
        lint:
          preset: "preset/lint-full.yml"
