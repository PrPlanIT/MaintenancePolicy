version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

# ──────────────────────────────────────────────────────────────────────
# Aliases: defined once, referenced by clusters and dogfood config below.
# ──────────────────────────────────────────────────────────────────────
defaults:
  # ── Shared asset declarations ──────────────────────────────────
  ci-skeleton: &ci-skeleton
    id: ci-skeleton
    source:
      repo_url: "https://gitlab.prplanit.com/PrPlanIT/StageFreight"
      ref: "main"
      path: "integrations/gitlab/gitlab-ci.yml"
    target: ".gitlab-ci.yml"

  claude-settings: &claude-settings
    id: claude-settings
    source:
      repo_url: "https://gitlab.prplanit.com/PrPlanIT/MaintenancePolicy"
      ref: "main"
      path: "claude-code/project-settings.json"
    target: ".claude/settings.json"

  # ── Baseline dials (always on for every governed repo) ─────────
  # Every dial that CAN be on, IS on. Clusters differ only in which
  # targets/badges presets they compose — never in the baseline.
  common-presets: &common-presets
    versioning:
      preset: "preset/versioning.yml"
    matchers:
      preset: "preset/matchers.yml"
    security:
      preset: "preset/security.yml"
    dependency:
      preset: "preset/dependency.yml"
    docs:
      preset: "preset/docs.yml"
    commit:
      preset: "preset/commit.yml"
    release:
      preset: "preset/release.yml"
    lint:
      preset: "preset/lint-full.yml"

# ──────────────────────────────────────────────────────────────────────
# MaintenancePolicy's own config (dogfood)
#
# Governance repo: consumes its own common baseline. No artifacts to
# publish — no targets, no registries, no badges.
# ──────────────────────────────────────────────────────────────────────
forges:
  - id: gitlab
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB

  - id: github
    provider: github
    url: "https://github.com"
    credentials: GITHUB

repos:
  - id: primary
    forge: gitlab
    project: "PrPlanIT/MaintenancePolicy"
    roles: [primary]
    branches:
      default: main
    worktree: "."

  - id: github-mirror
    forge: github
    project: "PrPlanIT/MaintenancePolicy"
    roles: [mirror]
    sync:
      git: true
      releases: true

lifecycle:
  mode: governance

<<: *common-presets

# ──────────────────────────────────────────────────────────────────────
# Governed clusters
# ──────────────────────────────────────────────────────────────────────
governance:
  clusters:
    # ── PrPlanIT: Binary apps ────────────────────────────────────
    - id: prplanit-displaywizard
      targets:
        repos:
          - "PrPlanIT/DisplayWizard"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-prplanit.yml"
        assets:
          - *ci-skeleton
          - *claude-settings
        <<: *common-presets
        targets:
          presets:
            - preset/targets-binary-archives.yml
            - preset/targets-shared-release.yml

    # ── PrPlanIT: Binaries + Docker (OCI) ────────────────────────
    - id: prplanit-binary-docker
      targets:
        repos:
          - "PrPlanIT/StageFreight"
          - "PrPlanIT/HASteward"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-prplanit.yml"
        assets:
          - *ci-skeleton
          - *claude-settings
        <<: *common-presets
        registries:
          preset: "preset/registries.yml"
        targets:
          presets:
            - preset/targets-binary-archives.yml
            - preset/targets-docker-registries.yml
            - preset/targets-docker-readme.yml
            - preset/targets-shared-release.yml
        badges:
          items:
            presets:
              - preset/badges-core.yml
              - preset/badges-docker.yml

    # ── PrPlanIT: Docker (OCI) ───────────────────────────────────
    - id: prplanit-docker
      targets:
        repos:
          - "PrPlanIT/fairer-pages"
          - "PrPlanIT/oh-CI"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-prplanit.yml"
        assets:
          - *ci-skeleton
          - *claude-settings
        <<: *common-presets
        registries:
          preset: "preset/registries.yml"
        targets:
          presets:
            - preset/targets-docker-registries.yml
            - preset/targets-docker-readme.yml
            - preset/targets-shared-release.yml
        badges:
          items:
            presets:
              - preset/badges-core.yml
              - preset/badges-docker.yml

    # ── HomeLabHD: Docker services ───────────────────────────────
    - id: hlhd-docker
      targets:
        credentials: GITLAB_HOMELABHD
        repos:
          - "HomeLabHD/apt-cacher-ng"
          - "HomeLabHD/prometheus-eaton-ups-exporter"
          - "HomeLabHD/sm-lickitung-gen"
          - "HomeLabHD/ansible"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-hlhd.yml"
        assets:
          - *ci-skeleton
          - *claude-settings
        <<: *common-presets
        registries:
          preset: "preset/registries.yml"
        targets:
          presets:
            - preset/targets-docker-registries.yml
            - preset/targets-docker-readme.yml
            - preset/targets-shared-release.yml
        badges:
          items:
            presets:
              - preset/badges-core.yml
              - preset/badges-docker.yml

    # ── SoFMeRight: GitOps repos ─────────────────────────────────
    - id: sofmeright-dungeon
      targets:
        credentials: GITLAB_SOFMERIGHT
        repos:
          - "SoFMeRight/dungeon"
      stagefreight:
        version: 1
        vars:
          preset: "preset/vars-sofmeright.yml"
        assets:
          - *ci-skeleton
          - *claude-settings
        <<: *common-presets
