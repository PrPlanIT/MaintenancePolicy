version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

# The control repo runs in governance mode: its own pipeline reconciles the profiles
# below into their satellites (rather than building an image). Governance activation is
# presence-gated on governance.profiles; the mode selects THIS repo's phase behavior.
lifecycle:
  mode: governance

# Named branch matchers referenced by publish/scribe when: gates.
git:
  branches:
    main: "^main$"

# ── surfaces: MaintenancePolicy's forges. default_path lets {path.<id>} derive. ──
forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB
    default_path: "{org}/{repo}"
  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB
    default_path: "{org.github}/{repo}"

# ── orgs = identity only (maintainer + aliases). No forge, no credentials. ──
orgs:
  # aliases carry the per-surface org names ({org.<surface>} facts) so shared presets
  # need no {var:} — HomeLabHD repos publish under the prplanit/PrPlanIT namespaces.
  PrPlanIT:
    maintainer: "PrPlanIT <precisionplanit@gmail.com>"
    aliases: { handle: prplanit, github: PrPlanIT, docker: prplanit, ghcr: prplanit }
  HomeLabHD:
    maintainer: "HomeLabHD <homelabhelp@gmail.com>"
    aliases: { handle: hlhd, github: HomeLabHD, docker: hlhd, ghcr: homelabhd }
  SoFMeRight:
    maintainer: "SoFMeRight <sofmeright@gmail.com>"
    aliases: { handle: sofmeright, github: SoFMeRight, docker: sofmeright, ghcr: sofmeright }

# ── MaintenancePolicy's OWN first-class identity (it is a repo too). ──
metadata:
  org: PrPlanIT
  title: "Maintenance Policy"
  description:
    - "Central maintenance policy + catalog for PrPlanIT / HomeLabHD repos."
    - "The StageFreight governance control repo: one place that owns org identity, per-repo branding, and shared lifecycle policy, reconciled into satellite repos."
  topics: [governance, stagefreight, catalog]
  license: MIT

repos:
  primary:
    forge: gitlab
    project: "PrPlanIT/MaintenancePolicy"
    roles: [primary]
    branches:
      default: main
    worktree: "."
  # GitHub mirror: the public face of the control repo. Carries the same README +
  # badges (mirror role → syncMirrors pushes content) and receives the identity push
  # (description/topics) from the project-meta target below.
  github:
    forge: github
    project: "PrPlanIT/MaintenancePolicy"
    roles: [mirror, publish-origin]   # publish-origin: the github-* badge producers (last-commit, contributors) resolve here

# ── project identity push: sync the metadata: block to both forges' About panels ──
# The control repo is a repo too; publish syncs its own title/description/topics to
# GitLab and GitHub. Identity comes from the metadata: block above (no fields inline)
# — the target says only WHERE to push. Runs in publish (which owns forge mutation).
publish:
  project-meta:
    kind: metadata
    repos: [primary, github]
    when: { branches: [main], events: [push] }

# ──────────────────────────────────────────────────────────────────────
# Governance: presence-gated (no lifecycle.mode). One profile, one repo (proof).
# A BRANDED catalog entry → governance distributes CI policy AND identity.
# ──────────────────────────────────────────────────────────────────────
governance:
  profiles:
    hlhd-docker:
      # HomeLabHD-scoped token: write to the group + its protected branches.
      credentials: GITLAB_HOMELABHD

      # WHAT — shared config distributed to every repo in this profile. Carries the
      # orgs block so each governed repo resolves {org.*}/{path.*} for its own identity.
      config:
        version: 1
        ci:
          # Which forge's CI skeleton governance renders and distributes alongside the
          # config. Declared, never inferred: .gitlab-ci.yml is DERIVED from
          # .stagefreight.yml, so distributing the config without it leaves every
          # satellite self-inconsistent and audition rejects the run as stale CI.
          forge: [gitlab]
          image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
        orgs:
          HomeLabHD:
            maintainer: "HomeLabHD <homelabhelp@gmail.com>"
            aliases: { handle: hlhd, github: HomeLabHD, docker: hlhd, ghcr: homelabhd }
        git: { preset: "preset/git.yml" }
        builds: { preset: "preset/build-docker.yml" }
        forges: { preset: "preset/forges.yml" }
        registries: { preset: "preset/registries.yml" }
        publish: { preset: "preset/publish-docker.yml" }
        build_cache: { preset: "preset/build_cache.yml" }
        dependency: { preset: "preset/dependency.yml" }
        commit: { preset: "preset/commit.yml" }
        lint: { preset: "preset/lint-generic.yml" }
        manifest: { preset: "preset/manifest.yml" }
        release: { preset: "preset/release.yml" }
        security: { preset: "preset/security.yml" }
        toolchains: { preset: "preset/toolchains.yml" }
        stencils: { presets: ["preset/stencils-base.yml", "preset/stencils-status.yml", "preset/stencils-docker.yml"] }
        scribe: { preset: "preset/scribe-docker.yml" }

      # WHO — the catalog. A BRANDED entry: governance distributes this repo's identity
      # (title/description/topics/license) as its metadata: block, on top of the CI policy.
      # org + slug derive from the location; the description feeds registry overviews +
      # the forge About, the license the license badge, {path.*} its coordinates.
      repos:
        ansible:
          at: HomeLabHD/ansible
          # A deviating entry: this image publishes a bill-of-materials into its docs —
          # apk/pip/galaxy/binaries inventories rendered from the build manifest. The
          # contents stencils name THIS build and the sections its manifest actually
          # emits, so they cannot live in the shared library. A per-repo config: override
          # replaces a whole top-level section (mergeConfigOverride is key-replace, not a
          # deep merge), so each section restates the profile's preset and then adds only
          # what is genuinely repo-specific.
          config:
            stencils:
              presets: ["preset/stencils-base.yml", "preset/stencils-status.yml", "preset/stencils-docker.yml"]
              # contents-base and contents-apk come from stencils-docker now; only the
              # inventories unique to this image are declared here. Redeclaring the
              # shared two is a duplicate-key error, not an override.
              contents-pip:      { type: contents, build: image, section: inventories.pip, render: badges }
              contents-galaxy:   { type: contents, build: image, section: inventories.galaxy, render: badges }
              contents-binaries: { type: contents, build: image, section: inventories.binaries, render: badges }
            scribe:
              preset: "preset/scribe-docker.yml"
              files:
                readme.versions: { file: "README.md", between: ["<!-- sf:versions:start -->", "<!-- sf:versions:end -->"], items: [contents-base] }
                readme.apk:      { file: "README.md", between: ["<!-- sf:apk:start -->", "<!-- sf:apk:end -->"], items: [contents-apk] }
                readme.pip:      { file: "README.md", between: ["<!-- sf:pip:start -->", "<!-- sf:pip:end -->"], items: [contents-pip] }
                readme.galaxy:   { file: "README.md", between: ["<!-- sf:galaxy:start -->", "<!-- sf:galaxy:end -->"], items: [contents-galaxy] }
                readme.binaries: { file: "README.md", between: ["<!-- sf:binaries:start -->", "<!-- sf:binaries:end -->"], items: [contents-binaries] }
                usage.tools:     { file: "docs/Usage.md", between: ["<!-- sf:usage-tools:start -->", "<!-- sf:usage-tools:end -->"], items: [contents-pip] }
                usage.galaxy:    { file: "docs/Usage.md", between: ["<!-- sf:usage-galaxy:start -->", "<!-- sf:usage-galaxy:end -->"], items: [contents-galaxy] }
              # restated because scribe writes a second file the preset does not know about
              commit:
                type: docs
                message: "refresh generated docs and badges"
                add: ["README.md", "docs/Usage.md", ".stagefreight/scribe"]
          title: "Ansible"
          description:
            - "Container image for running Ansible playbooks in CI and local automation."
            - "Lightweight Ansible image preloaded with common community collections, WinRM support for Windows nodes, and kubectl + kustomize for Kubernetes work — built for running playbooks in CI/CD pipelines and homelab automation."
          topics: [ansible, automation, iac, ci, kubernetes, winrm]
          # Upstream's license, kept as-is — matches org.opencontainers.image.licenses.
          license: GPL-3.0
          category: automation

        apt-cacher-ng:
          at: HomeLabHD/apt-cacher-ng
          title: "APT Cacher NG"
          description:
            - "Caching proxy for Debian and Ubuntu package downloads."
            - "Rootless apt-cacher-ng container that caches APT package downloads to cut bandwidth and speed up repeat installs across CI pipelines and homelab networks, with container log streaming, runtime tuning, init-managed volume ownership, and an HTTP health check."
          topics: [apt, apt-cacher-ng, caching-proxy, debian, ubuntu, homelab, ci]
          # Upstream's license, kept as-is: apt-cacher-ng is BSD-4-Clause (Eduard Bloch),
          # matching org.opencontainers.image.licenses in the Dockerfile.
          license: BSD-4-Clause
          category: infrastructure

        ark-se-server:
          at: HomeLabHD/ark-se-server
          # OPEN — default branch is `master` while the publish preset gates on `main`,
          # so publish will not fire until that branch is flipped. Not worked around
          # here: overriding publish: would replace the whole section wholesale.
          title: "ARK: Survival Evolved Server"
          description:
            - "Dedicated server image for ARK: Survival Evolved, for single instances and clusters."
            - "Container image running an ARK: Survival Evolved dedicated server, supporting both standalone instances and multi-server clusters, built on the SteamCMD base image."
          topics: [ark, game-server, steamcmd, dedicated-server, gaming]
          # Upstream's license, kept as-is: forked from SickHub/arkserver (MIT).
          license: MIT
          category: games

        echoip:
          at: HomeLabHD/echoip
          # Deviating: a Go container repo, so it composes the Go stencils on top of the
          # profile's docker set, swaps in the Go+docker scribe rows, and runs `go test`.
          # The profile itself stays language-neutral.
          config:
            stencils:
              presets: ["preset/stencils-base.yml", "preset/stencils-status.yml", "preset/stencils-docker.yml", "preset/stencils-go.yml"]
            scribe: { preset: "preset/scribe-go-docker.yml" }
            test: { preset: "preset/test-go.yml" }
          title: "echoip"
          description:
            - "Self-hosted service for looking up your own public IP address."
            - "Container image for echoip, a small IP-address lookup service that reports the caller's public address and geolocation over plain HTTP or JSON, suitable for self-hosting behind a reverse proxy."
          topics: [ip, geoip, lookup, networking, self-hosted]
          # Upstream's license, kept as-is: echoip is BSD-3-Clause (Martin Polden).
          license: BSD-3-Clause
          category: networking

        frappe-suite:
          at: HomeLabHD/frappe-suite
          # Deviating: upstream owns the build recipe. frappe_docker is a pinned
          # submodule rather than a vendored copy, so the recipe cannot drift from the
          # project that maintains it, and the app set is passed as a build secret —
          # neither of which the shared docker build can describe.
          config:
            git:
              preset: "preset/git.yml"
              # Without the submodule the context directory is empty and the build
              # fails on a missing Containerfile rather than on the checkout it skipped.
              submodules: true
            builds:
              image:
                kind: docker
                dockerfile: frappe_docker/images/custom/Containerfile
                context: frappe_docker
                platforms: [linux/amd64]
                secrets:
                  # The Containerfile mounts the app list for a single RUN; the
                  # APPS_JSON_BASE64 build arg most guides still show is gone upstream.
                  apps_json: apps.json
                build_args:
                  # A v15 app cannot run on a v16 framework, and the Containerfile
                  # defaults to v16; every app in apps.json is v15.
                  FRAPPE_BRANCH: version-15
                  PYTHON_VERSION: "3.12.12"
                  NODE_VERSION: "22.22.0"
            build_cache:
              preset: "preset/build_cache.yml"
              # Local only: the shared policy also pushes cache layers to Harbor, which
              # for an image this size costs more registry storage than the pull saves.
              mode: local
          title: "Frappe Bench"
          description:
            - "ERPNext with HR, CRM, and helpdesk, built as one container image."
            - "Frappe bench image bundling ERPNext, HRMS, telephony, and helpdesk on the v15 framework."
          topics: [erpnext, frappe, erp, hrms, helpdesk, docker]
          license: GPL-3.0
          category: applications
        nginx-extras:
          at: HomeLabHD/nginx-extras
          title: "NGINX Extras"
          description:
            - "NGINX on Alpine with the extras module set compiled in."
            - "Alpine-based NGINX image with dynamic modules for headers-more, brotli, geoip2, and echo, plus a private health endpoint, Cloudflare real-client-IP refresh at startup, and strict TLS defaults with HSTS enabled."
          topics: [nginx, alpine, reverse-proxy, brotli, geoip2, tls]
          # Upstream's license, kept as-is — matches org.opencontainers.image.licenses.
          license: GPL-3.0
          category: infrastructure

        steamcmd:
          at: HomeLabHD/SteamCMD
          title: "SteamCMD"
          description:
            - "SteamCMD base image for building game-server containers."
            - "Debian-slim SteamCMD base image with glibc and i386 multiarch support for game-server containers, kept to a minimal CVE surface as a foundation for dedicated-server images."
          topics: [steamcmd, game-server, steam, base-image, debian]
          license: MIT
          category: games

        sm-lickitung-gen:
          at: HomeLabHD/sm-lickitung-gen
          # Deliberately non-specific: this metadata is pushed to Docker Hub and the
          # forge About panel, i.e. it is indexed and searchable. Every statement is
          # true, none of it advertises what the tool computes.
          title: "SM Lickitung Gen"
          description:
            - "Static single-page utility served from a minimal nginx container."
            - "Minimal nginx container serving a self-contained HTML+JS utility for out-of-production server baseboard-management hardware. Non-commercial, educational and research use only."
          topics: [static-site, nginx, homelab, utility]
          license: MIT
          category: utilities

        osticket:
          at: HomeLabHD/osticket
          title: "osTicket"
          description:
            - "Rootless container image for osTicket, the open-source support ticketing system."
            - "Rootless osTicket image running nginx and php-fpm under a minimal tini init on stock php:8.3-fpm-alpine — runs as uid 1000 and under arbitrary UIDs for hardened clusters, bundles the official and community plugin sets, and leaves cron to a separate scheduled job."
          topics: [osticket, ticketing, helpdesk, support, php, nginx, rootless]
          # Upstream's license, kept as-is: osTicket is GPL-2.0.
          license: GPL-2.0
          category: applications

        prometheus-eaton-ups-exporter:
          at: HomeLabHD/prometheus-eaton-ups-exporter
          # A deviating entry: this repo is Python, so it overrides the profile's
          # (docker-only) config with a pytest suite. The profile stays language-neutral.
          config:
            test: { preset: "preset/test-python.yml" }
          title: "Eaton UPS Exporter"
          description:
            - "Prometheus exporter for Eaton UPS devices via the Eaton REST API."
            - "Rootless container exporting Eaton UPS load, runtime, battery, and I/O metrics to Prometheus, scraped over the UPS web API."
          topics: [prometheus, exporter, ups, eaton, monitoring]
          license: ISC
          category: monitoring

        weave-gitops:
          at: HomeLabHD/weave-gitops
          # A deviating entry: a fork carrying upstream's 302M website/ tree, which the
          # generic exclude (binary file types only) would walk every run. Restated in
          # full because a repo config: replaces the key rather than merging into it.
          config:
            lint:
              preset: "preset/lint-generic.yml"
              exclude: ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.webp", "*.ico",
                        "*.svg", "*.ttf", "*.woff", "*.woff2", "*.pdf", "website/**"]
          title: "Weave GitOps"
          description:
            - "Web UI for Flux, showing GitOps reconciliation state across a cluster."
            - "Fork of the Weave GitOps dashboard, serving a view of Flux Kustomizations, HelmReleases, and sources, with the image built and published from this repo."
          topics: [gitops, flux, kubernetes, dashboard, continuous-delivery]
          license: Apache-2.0
          category: kubernetes

    # A SECOND profile rather than more repos in hlhd-docker: a profile is a credential
    # and identity scope, not a config bundle. PrPlanIT repos live in a different GitLab
    # group (its own write token) and publish under the prplanit registry namespaces, so
    # folding them in would mean one token reaching across both groups and an `orgs:`
    # block carrying an org its own name denies. The POLICY is identical — every preset
    # below is the same file hlhd-docker uses.
    prplanit-docker:
      # GITLAB_TOKEN — MP itself lives in PrPlanIT, so its own group token already
      # writes here. hlhd-docker needs the separate GITLAB_HOMELABHD_TOKEN because that
      # group is not MP's own; stated explicitly so neither profile looks like it
      # inherits the other's credential.
      credentials: GITLAB

      config:
        version: 1
        ci:
          forge: [gitlab]
          image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
        orgs:
          PrPlanIT:
            maintainer: "PrPlanIT <precisionplanit@gmail.com>"
            aliases: { handle: prplanit, github: PrPlanIT, docker: prplanit, ghcr: prplanit }
        git: { preset: "preset/git.yml" }
        builds: { preset: "preset/build-docker.yml" }
        forges: { preset: "preset/forges.yml" }
        registries: { preset: "preset/registries.yml" }
        publish: { preset: "preset/publish-docker.yml" }
        build_cache: { preset: "preset/build_cache.yml" }
        dependency: { preset: "preset/dependency.yml" }
        commit: { preset: "preset/commit.yml" }
        lint: { preset: "preset/lint-generic.yml" }
        manifest: { preset: "preset/manifest.yml" }
        release: { preset: "preset/release.yml" }
        security: { preset: "preset/security.yml" }
        toolchains: { preset: "preset/toolchains.yml" }
        stencils: { presets: ["preset/stencils-base.yml", "preset/stencils-status.yml", "preset/stencils-docker.yml"] }
        scribe: { preset: "preset/scribe-docker.yml" }

      repos:
        fairer-pages:
          at: PrPlanIT/fairer-pages
          title: "Fairer Pages"
          description:
            - "Error pages as a service, with 64 themes and per-domain playlists."
            - "Self-hosted error-page service that serves styled HTTP error pages per domain, shipping 64 themes and playlists that rotate between them, with low-code customisation so pages can be edited without touching the stack."
          topics: [error-pages, self-hosted, themes, docker, web]
          # AGPL-3.0 per the repo's LICENSE — a network-use copyleft, deliberately not
          # the permissive default the other entries carry.
          license: AGPL-3.0
          category: applications

        istio-meshmedic:
          at: PrPlanIT/istio-meshmedic
          title: "Istio MeshMedic"
          description:
            - "Diagnoses and repairs Istio service-mesh configuration drift."
            - "Operator-facing tool that inspects an Istio mesh for misconfiguration and policy drift, and reports or repairs what it finds."
          topics: [istio, service-mesh, kubernetes, diagnostics]
          license: MIT
          category: infrastructure

        oh-CI:
          at: PrPlanIT/oh-CI
          title: "oh-CI"
          description:
            - "CI helper image with the tooling a pipeline expects preinstalled."
            - "Container image bundling the utilities CI jobs reach for, so pipelines stop installing the same tools on every run."
          topics: [ci, docker, tooling]
          license: MIT
          category: infrastructure

        static-site:
          at: PrPlanIT/static-site
          title: "Static Site"
          description:
            - "Base image for serving a static site from a container."
            - "Minimal container image that serves a static site directory, used as the base for the .com site repos."
          topics: [static-site, nginx, docker]
          license: MIT
          category: infrastructure

        dd-ui:
          at: PrPlanIT/dd-ui
          # Deviating: it also publishes a per-branch Harbor image so a branch build can
          # be pulled before merge. A config: override replaces the whole section, so the
          # preset is restated and only the extra target added.
          config:
            publish:
              preset: "preset/publish-docker.yml"
              harbor-branch-dev:
                kind: registry
                registry: [harbor]
                build: image
                tags: ["test-{branch}-{sha:8}", "latest-test-{branch}"]
                when: { branches: ["!main"], events: [push] }
                retention:
                  keep_last: 6
                  keep_branches: 10
            test: { preset: "preset/test-go.yml" }
          title: "DD-UI"
          description:
            - "Web UI for managing Docker hosts and their compose stacks."
            - "Browser interface over Docker and compose deployments, for inspecting and operating containers across hosts."
          topics: [docker, ui, web, management]
          license: MIT
          category: applications

    # A THIRD profile, sibling to prplanit-docker and on the same PrPlanIT token: these
    # repos build an image AND deploy a Cloudflare Pages site, which prplanit-docker has
    # no target for. Nothing here is cross-org -- the site names are repo names, and both
    # repos are PrPlanIT end to end. The split is policy, not identity.
    prplanit-sites:
      credentials: GITLAB

      config:
        version: 1
        ci:
          forge: [gitlab]
          image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
        orgs:
          PrPlanIT:
            maintainer: "PrPlanIT <precisionplanit@gmail.com>"
            aliases: { handle: prplanit, github: PrPlanIT, docker: prplanit, ghcr: prplanit }
        git: { preset: "preset/git.yml" }
        builds: { preset: "preset/build-docker.yml" }
        forges: { preset: "preset/forges.yml" }
        registries: { preset: "preset/registries.yml" }
        publish: { preset: "preset/publish-docker-pages.yml" }
        build_cache: { preset: "preset/build_cache.yml" }
        dependency: { preset: "preset/dependency.yml" }
        commit: { preset: "preset/commit.yml" }
        lint: { preset: "preset/lint-generic.yml" }
        manifest: { preset: "preset/manifest.yml" }
        release: { preset: "preset/release.yml" }
        security: { preset: "preset/security.yml" }
        toolchains: { preset: "preset/toolchains.yml" }
        stencils: { presets: ["preset/stencils-base.yml", "preset/stencils-status.yml", "preset/stencils-docker.yml"] }
        # scribe-site, not scribe-docker: a site's image goes to harbor + ghcr only, so
        # the docker/pulls badges would report a pull count for a repository nothing was
        # ever pushed to.
        scribe: { preset: "preset/scribe-site.yml" }

      repos:
        precisionplanit.com:
          at: PrPlanIT/precisionplanit.com
          # project and domain are the only per-site facts; the rest of the pages target
          # comes from the preset. This one answers on a second apex as well.
          config:
            publish:
              # A config: override REPLACES the whole section (key-replace, not a deep
              # merge), so the preset must be restated here or every registry target and
              # the pages target's own kind/provider/dir vanish with it. The pages map
              # then deep-merges, adding only the two per-site facts.
              preset: "preset/publish-docker-pages.yml"
              pages:
                project: precisionplanit
                domain: [precisionplanit.com, prplanit.com]
          title: "precisionplanit.com"
          description:
            - "Company site for PrecisionPlanIT, built as an image and deployed to Cloudflare Pages."
            - "Static site for precisionplanit.com, also serving prplanit.com, built into a container image and deployed to Cloudflare Pages on every main push."
          topics: [website, static-site, cloudflare-pages, docker]
          license: MIT
          category: websites

        homelabhelpdesk.com:
          at: PrPlanIT/homelabhelpdesk.com
          config:
            publish:
              preset: "preset/publish-docker-pages.yml"
              pages:
                project: homelabhelpdesk
                domain: homelabhelpdesk.com
          title: "homelabhelpdesk.com"
          description:
            - "Site for HomeLab Helpdesk, built as an image and deployed to Cloudflare Pages."
            - "Static site for homelabhelpdesk.com, built into a container image and deployed to Cloudflare Pages on every main push."
          topics: [website, static-site, cloudflare-pages, docker]
          license: MIT
          category: websites

    # Go repos that ship an image AND a CLI. Same PrPlanIT token; the split from
    # prplanit-docker is the binary half -- archives, and releases that carry them.
    prplanit-go:
      credentials: GITLAB
      config:
        version: 1
        ci:
          forge: [gitlab]
          image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev
        orgs:
          PrPlanIT:
            maintainer: "PrPlanIT <precisionplanit@gmail.com>"
            aliases: { handle: prplanit, github: PrPlanIT, docker: prplanit, ghcr: prplanit }
        git: { preset: "preset/git.yml" }
        forges: { preset: "preset/forges.yml" }
        registries: { preset: "preset/registries.yml" }
        publish: { preset: "preset/publish-docker-binary.yml" }
        build_cache: { preset: "preset/build_cache.yml" }
        dependency: { preset: "preset/dependency.yml" }
        commit: { preset: "preset/commit.yml" }
        lint: { preset: "preset/lint-flagships.yml" }
        manifest: { preset: "preset/manifest.yml" }
        release: { preset: "preset/release.yml" }
        security: { preset: "preset/security.yml" }
        toolchains: { preset: "preset/toolchains.yml" }
        test: { preset: "preset/test-go.yml" }
        stencils: { presets: ["preset/stencils-base.yml", "preset/stencils-status.yml", "preset/stencils-docker.yml", "preset/stencils-go.yml"] }
        scribe: { preset: "preset/scribe-go-docker.yml" }

      repos:
        PolySieve:
          at: PrPlanIT/PolySieve
          # builds are irreducibly per-repo: the ldflags carry this module's own version
          # package path. The build IDs are standardised (image / bin) so the shared
          # publish targets need no per-repo editing.
          config:
            builds:
              preset: "preset/build-docker.yml"
              bin:
                kind: binary
                builder: go
                from: ./cmd/polysieve
                output: polysieve
                env: { CGO_ENABLED: "0" }
                args: ["-ldflags", "-s -w -X github.com/PrPlanIT/PolySieve/internal/cli.version={version} -X github.com/PrPlanIT/PolySieve/internal/cli.commit={sha} -X github.com/PrPlanIT/PolySieve/internal/cli.buildDate={date}"]
                platforms: [linux/amd64, linux/arm64]
          title: "PolySieve"
          description:
            - "Generates Kubernetes network and security policies from live cluster state."
            - "Reads what a cluster actually does and emits the network/security policies to match, so policy is derived from observed traffic rather than written by hand."
          topics: [kubernetes, network-policy, security, cilium]
          license: MIT
          category: infrastructure

        HASteward:
          at: PrPlanIT/HASteward
          # The richest entry here: besides the CLI it publishes a docs site to BOTH
          # Cloudflare and GitHub Pages from a docs-site command build, and carries a
          # `reference` build that generates its command reference. Nothing else does.
          config:
            builds:
              preset: "preset/build-docker.yml"
              bin:
                kind: binary
                builder: go
                from: ./cmd/hasteward
                output: hasteward
                env: { CGO_ENABLED: "0" }
                args: ["-ldflags", "-s -w -X github.com/PrPlanIT/HASteward/src/version.Version={version} -X github.com/PrPlanIT/HASteward/src/version.Commit={sha} -X github.com/PrPlanIT/HASteward/src/version.BuildDate={date}"]
                platforms: [linux/amd64, linux/arm64]
              # `reference` runs the built CLI to regenerate its own command reference
              # into the worktree; docs-site then builds the mkdocs tree the pages
              # targets deploy. Both are command builds, unique to this repo.
              reference:
                kind: command
                stage: { from: bin, as: hasteward }
                command: ["./hasteward", "docs", "generate", "--output-dir", "{output}"]
                outputs:
                  - { type: tree, source: docs/assets/modules, worktree: true }
              docs-site:
                kind: command
                image: docker.io/library/python:3.12-slim
                command: "pip install --quiet --root-user-action=ignore mkdocs-material && mkdocs build -f docs/assets/mkdocs/mkdocs.yml --strict --site-dir $(pwd)/site"
                outputs:
                  - { type: tree, source: site }
            publish:
              preset: "preset/publish-docker-binary.yml"
              docs:
                kind: pages
                provider: cloudflare
                project: hasteward
                build: docs-site
                domain: hasteward.prplanit.com
                when: { git_tags: [stable], events: [tag] }
              docs-github:
                kind: pages
                provider: github
                project_id: "{org.github}/{slug}"
                credentials: GITHUB
                build: docs-site
                when: { git_tags: [stable], events: [tag] }
          title: "HASteward"
          description:
            - "Stateful-workload steward for Kubernetes: bootstraps, heals and migrates databases."
            - "Operator-facing tool that bootstraps and repairs stateful workloads on Kubernetes -- Galera, CNPG and friends -- including triage and recovery of clusters that will not converge on their own."
          topics: [kubernetes, databases, galera, cnpg, operations]
          license: MIT
          category: infrastructure

    # Binary-only: same policy as prplanit-go, minus every registry target. No image is
    # published here for now, so the repo ships archives and releases and nothing else.
    prplanit-bin:
