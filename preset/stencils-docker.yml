# Docker/image add-on stencils — compose after stencils-core.yml for a container repo.
# Fact-based: {org.docker} (registry namespace via org alias), {slug} (repo name),
# {path.github} (GHCR package location), {registry.*} (live tag size/updated/pulls).
stencils:
  ghcr:            { render: shield, label: GHCR,   message: "{org.docker}/{slug}", color: "#181717", logo: github, logo_color: white, link: "https://github.com/{path.github}/pkgs/container/{slug}" }
  docker:          { render: shield, label: Docker, message: "{org.docker}/{slug}", color: "#2496ED", logo: docker, logo_color: white, link: "https://hub.docker.com/r/{org.docker}/{slug}" }
  pulls:           { label: pulls, message: "{registry.dockerhub.pulls}", color: "#1d63ed", link: "https://hub.docker.com/r/{org.docker}/{slug}" }
  harbor:          { render: shield, label: Harbor, message: "{org.docker}/{slug}", color: "#60b932", link: "https://cr.pcfae.com/harbor/projects" }
  release-latest:  { label: latest, message: "v{base}", color: "#74ecbe", font: dejavu-sans, font_size: 11, link: "https://github.com/{path.github}/pkgs/container/{slug}" }
  release-updated: { label: updated, message: "{registry.ghcr.tag.v{base}.updated}", color: "#236144", font: dejavu-sans, font_size: 11 }
  release-size:    { label: size, message: "{registry.ghcr.tag.v{base}.size}", color: "#555", font: dejavu-sans, font_size: 11, link: "https://github.com/{path.github}/pkgs/container/{slug}" }
  dev-latest:      { label: latest-dev, message: "dev-{sha:8}", color: "#3b82f6", font: dejavu-sans, font_size: 11, link: "https://github.com/{path.github}/pkgs/container/{slug}" }
  dev-updated:     { label: updated, message: "{registry.ghcr.tag.latest-dev.updated}", color: "#236144", font: dejavu-sans, font_size: 11 }
  dev-size:        { label: size, message: "{registry.ghcr.tag.latest-dev.size}", color: "#555", font: dejavu-sans, font_size: 11, link: "https://github.com/{path.github}/pkgs/container/{slug}" }
