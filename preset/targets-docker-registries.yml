targets:
  # ── Docker Hub: stable releases ─────────────────────────────────
  - id: dockerhub-stable
    kind: registry
    registry: dockerhub
    tags:
      - "v{version}"
      - "latest"
    when: { git_tags: [stable], events: [tag] }

  # ── Docker Hub: pre-releases ────────────────────────────────────
  - id: dockerhub-prerelease
    kind: registry
    registry: dockerhub
    tags:
      - "v{version}"
    when: { git_tags: [prerelease], events: [tag] }

  # ── Docker Hub: dev builds ──────────────────────────────────────
  - id: dockerhub-dev
    kind: registry
    registry: dockerhub
    tags:
      - "dev-{sha:8}"
      - "latest-dev"
    when: { branches: [main], events: [push] }
    retention:
      keep_last: 6
      protect: ["latest-dev"]

  # ── Harbor: stable releases ─────────────────────────────────────
  - id: harbor-stable
    kind: registry
    registry: harbor
    tags:
      - "v{version}"
      - "latest"
    when: { git_tags: [stable], events: [tag] }

  # ── Harbor: dev builds ──────────────────────────────────────────
  - id: harbor-dev
    kind: registry
    registry: harbor
    tags:
      - "dev-{sha:8}"
      - "latest-dev"
    when: { branches: [main], events: [push] }
